name = "physio-whatsapp-reminders"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Runs every 15 minutes. Each tick sends reminders for clinic sessions that have
# just entered their per-clinic "lead hours before" window and have not been sent yet.
[triggers]
crons = ["*/15 * * * *"]

[vars]
# Meta WhatsApp Cloud API (Graph API) version.
META_API_VERSION = "v21.0"
# Language code of your approved templates (must match Meta exactly).
TEMPLATE_LANG = "en"
# Default country code applied to patient phone numbers that omit one (91 = India).
DEFAULT_COUNTRY_CODE = "91"
# Names of the two approved WhatsApp message templates (see README).
TEMPLATE_WITH_LOCATION = "appointment_reminder_location"
TEMPLATE_NO_LOCATION = "appointment_reminder"

# ── Secrets (set with `wrangler secret put <NAME>`; never commit these) ──
#   SUPABASE_URL              e.g. https://xxxx.supabase.co
#   SUPABASE_SERVICE_KEY      Supabase service-role key (server-side only)
#   WHATSAPP_TOKEN            Meta permanent access token
#   WHATSAPP_PHONE_NUMBER_ID  Meta WhatsApp phone number ID
#   TRIGGER_TOKEN             Bearer token for the manual /run test endpoint
